body{

/* BACKGROUND FOTO */
.background-photo{

/* LAPISAN GELAP */
.page-overlay{

}

/* HEADER */
header{
  padding:18px 5%;

}

/* BAGIAN ATAS */
.hero{

}

  font-weight:bold;
}

}

}

.credit{
  margin-top:15px;
  color:#8dbdff;
}

/* BANNER VIDEO 16:9 */
.banner{
  width:88%;
  max-width:1100px;
  margin:10px auto 30px;
  aspect-ratio:16/9;
  overflow:hidden;
  border-radius:14px;
  border:1px solid #28598e;
  background:#000;
  box-shadow:0 10px 35px rgba(0,0,0,.45);
}

.banner video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* VIDEO */
.section{
  padding:10px 5% 50px;
}

.section h2{
  margin-bottom:18px;
}

/* KATEGORI */
.categories{
  display:flex;
  gap:10px;
  margin-bottom:22px;
  flex-wrap:wrap;
}

.category{
  border:none;
  padding:9px 18px;
  border-radius:20px;
  background:#101a2c;
  border:1px solid #28598e;
  color:white;
  cursor:pointer;
}

.category.active{
  background:#1677ff;
  border-color:#1677ff;
}

/* LIST VIDEO */
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
}

/* VIDEO TANPA THUMBNAIL */
.card{
  background:rgba(12,21,38,.94);
  border:1px solid #1d385d;
  border-radius:12px;
  padding:18px;
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  border-color:#3191ff;
}

.card h3{
  font-size:16px;
  color:white;
}

/* HALAMAN NONTON */
.watch{
  display:none;
  padding:25px 5% 50px;
}

.back{
  border:0;
  background:#1677ff;
  color:white;
  padding:10px 16px;
  border-radius:20px;
  cursor:pointer;
  margin-bottom:20px;
}

.player{
  width:100%;
  height:70vh;
  background:#000;
  border-radius:12px;
  border:none;
}

.watch h2{
  margin:15px 0;
}

/* HP */
@media(max-width:600px){

  }

const grid =
  document.getElementById("grid");

const search =
  document.getElementById("search");


/* MENAMPILKAN VIDEO */
function render(list){

  grid.innerHTML="";

  list.forEach(v=>{

    const card =
      document.createElement("div");

    card.className="card";

    card.innerHTML=`
      <h3>${v.title}</h3>
    `;

    card.onclick=()=>{
      openWatch(v);
    };

    grid.appendChild(card);

  });

}


/* FILTER KATEGORI */
function filterCategory(category,button){

  document
    .querySelectorAll(".category")
    .forEach(btn=>{
      btn.classList.remove("active");
    });

  button.classList.add("active");

  const keyword =
    search.value.toLowerCase();

  let result;

  if(category==="Semua"){

    result=videos;

  }else{

    result=
      videos.filter(v=>
        v.category===category
      );

  }

  if(keyword){

    result=
      result.filter(v=>
        v.title
          .toLowerCase()
          .includes(keyword)
      );

  }

  render(result);

}


/* SEARCH */
search.addEventListener(
  "input",
  ()=>{

    const keyword =
      search.value.toLowerCase();

    const result =
      videos.filter(v=>
        v.title
          .toLowerCase()
          .includes(keyword)
      );

    render(result);

  }
);


/* BUKA VIDEO */
function openWatch(v){

  document.getElementById("home").style.display="none";
  document.getElementById("watch").style.display="block";

  document.getElementById("watchTitle").textContent=v.title;

  const player = document.getElementById("player");

  player.pause();
  player.src = v.file;
  player.load();

  window.scrollTo(0,0);
}


/* KEMBALI */
function closeWatch(){

  const player =
    document.getElementById("player");

  player.pause();

  player.src="";

  document
    .getElementById("watch")
    .style.display="none";

  document
    .getElementById("home")
    .style.display="block";

  window.scrollTo(0,0);

}


/* TAMPILKAN SEMUA */
render(videos);
